# CI template from the github-release skill. Copy to .github/workflows/ci.yml.
# Runs the same checks the tag workflow runs, so problems surface before a tag exists,
# and proves that Windows and Ubuntu builds produce identical archives.
# Pushed release branches get CI before a PR exists; workflow_dispatch reruns it on demand.
# Action pins: full commit SHA + the release tag they were resolved from (checked 2026-10-09).
name: CI

on:
  push:
    branches: [main, 'release/**', 'v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: windows-latest, python: '3.11'}
          - {os: ubuntu-22.04, python: '3.8'}  # oldest supported Python; drop this leg if the runner image or setup-python retires 3.8
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        shell: bash
        run: if [ -d tests ]; then python -m unittest discover -s tests -v; else echo "no tests directory"; fi
      - name: Gate checks (versions agree, notes lint, record encoding, workflow is draft-first)
        shell: bash
        run: |
          VERSION=$(python packaging/build_packages.py --describe | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          python packaging/check_versions.py --repo . --config packaging/version_files.json \
            --version "$VERSION" --previous-from-changelog --workflow .github/workflows/release.yml
      - name: Candidate build (byte-verified, not published)
        shell: bash
        run: python packaging/build_packages.py "$RUNNER_TEMP/candidate" --status "CI candidate, not published"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sums-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/candidate/SHA256SUMS.txt

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Frontmatter and OpenAI skill validator (pinned)
        run: |
          printf '%s\n' 'PyYAML==6.0.2 --hash=sha256:3ad2a3decf9aaba3d29c8f537ac4b243e36bef957511b4766cb0057d32b0be85' > "$RUNNER_TEMP/validation-requirements.txt"
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/validation-requirements.txt"
          SKILL=$(python packaging/build_packages.py --describe | python -c 'import json,sys; print(json.load(sys.stdin)["skill"])')
          python - "$SKILL" <<'PY'
          import sys, yaml
          sys.path.insert(0, 'packaging')
          from build_packages import frontmatter
          name = sys.argv[1]
          fm = yaml.safe_load(frontmatter(open(f'skills/{name}/SKILL.md', 'rb').read())[0])
          if not isinstance(fm, dict) or fm.get('name') != name:
              sys.exit('frontmatter name does not match configured skill')
          desc = fm.get('description')
          if not isinstance(desc, str) or not desc.strip() or len(desc) > 1024:
              sys.exit('description missing or over 1024 chars')
          print('Frontmatter OK')
          PY
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/openai/skills/49f948faa9258a0c61caceaf225e179651397431/skills/.system/skill-creator/scripts/quick_validate.py \
            --output /tmp/openai-quick-validate.py
          echo "6cc9dc3199c935916cf6f73fcbbbb0e3bb1b58c8f5109fefa499978908164f51  /tmp/openai-quick-validate.py" | sha256sum --check
          python /tmp/openai-quick-validate.py "skills/$SKILL"

  same-bytes:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: sums
      - name: Windows and Ubuntu builds must be byte-identical
        run: |
          ls sums
          diff sums/sums-ubuntu-latest-3.11/SHA256SUMS.txt sums/sums-windows-latest-3.11/SHA256SUMS.txt
          diff sums/sums-ubuntu-latest-3.11/SHA256SUMS.txt sums/sums-ubuntu-22.04-3.8/SHA256SUMS.txt
          echo "Identical archives across all three OS/Python combinations"
