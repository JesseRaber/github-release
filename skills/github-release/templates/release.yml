# Release workflow template from the github-release skill.
# Copy to .github/workflows/release.yml. On a pushed tag vX.Y.Z it gates, builds,
# and creates a DRAFT release. A person publishes the draft after verifying it.
# It never replaces assets of an existing release.
# Actions are pinned by full commit SHA with the release tag in a comment (resolved
# 2026-10-09); the validator is pinned by commit. Review pins before first use.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.2.0). Builds artifacts only; never creates a release.'
        required: true

permissions:
  contents: read

jobs:
  build:
    outputs:
      version: ${{ steps.ver.outputs.version }}
      skill: ${{ steps.ver.outputs.skill }}
      artifact-id: ${{ steps.packages.outputs.artifact-id }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # later steps run downloaded code; do not leave the write token in .git
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install validation dependency
        run: |
          printf '%s\n' 'PyYAML==6.0.2 --hash=sha256:3ad2a3decf9aaba3d29c8f537ac4b243e36bef957511b4766cb0057d32b0be85' > "$RUNNER_TEMP/validation-requirements.txt"
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/validation-requirements.txt"

      - name: Resolve version and skill
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then VERSION="$INPUT_VERSION"; else VERSION="${GITHUB_REF_NAME#v}"; fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "Refusing non-semver version: $VERSION"; exit 1; fi
          SKILL=$(python packaging/build_packages.py --describe | python -c 'import json,sys; print(json.load(sys.stdin)["skill"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "skill=$SKILL" >> "$GITHUB_OUTPUT"

      - name: Versions agree, notes lint (no candidate wording), record encoding
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python3 packaging/check_versions.py --repo . --config packaging/version_files.json \
            --version "$VERSION" --previous-from-changelog --workflow .github/workflows/release.yml

      - name: Validate skill frontmatter
        env:
          SKILL: ${{ steps.ver.outputs.skill }}
        run: |
          python3 - "$SKILL" <<'EOF'
          import sys, yaml
          sys.path.insert(0, 'packaging')
          from build_packages import frontmatter
          name = sys.argv[1]
          fm = yaml.safe_load(frontmatter(open(f'skills/{name}/SKILL.md', 'rb').read())[0])
          if not isinstance(fm, dict) or fm.get('name') != name:
              sys.exit('frontmatter name does not match configured skill')
          desc = fm.get('description')
          if not isinstance(desc, str) or not desc.strip() or len(desc) > 1024:
              sys.exit('description missing or over 1024 chars')
          print('Frontmatter OK')
          EOF

      - name: Run OpenAI skill validator (commit and SHA-256 pinned)
        env:
          SKILL: ${{ steps.ver.outputs.skill }}
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/openai/skills/49f948faa9258a0c61caceaf225e179651397431/skills/.system/skill-creator/scripts/quick_validate.py \
            --output /tmp/openai-quick-validate.py
          echo "6cc9dc3199c935916cf6f73fcbbbb0e3bb1b58c8f5109fefa499978908164f51  /tmp/openai-quick-validate.py" | sha256sum --check
          python /tmp/openai-quick-validate.py "skills/$SKILL"

      - name: Run tests
        run: if [ -d tests ]; then python -m unittest discover -s tests -v; else echo "no tests directory"; fi

      - name: Build and verify packages
        run: |
          set -euo pipefail
          rm -rf dist
          python3 packaging/build_packages.py dist --status "release build ${GITHUB_REF_NAME}"
          cat dist/SHA256SUMS.txt
          if find dist -name __pycache__ | grep -q .; then echo "__pycache__ leaked"; exit 1; fi

      - name: Upload build artifacts
        id: packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ steps.ver.outputs.version }}
          path: dist/

  draft:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/
          merge-multiple: true
      - name: Verify downloaded build artifact
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: python3 packaging/verify_release.py --assets dist --version "$VERSION"

      - name: Refuse if a release for this tag already exists
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "A release for $GITHUB_REF_NAME already exists. Published bytes are never replaced; ship a new version."
            exit 1
          fi

      - name: Create DRAFT release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          SKILL: ${{ needs.build.outputs.skill }}
        run: |
          set -euo pipefail
          NOTES="packaging/RELEASE_NOTES_v$VERSION.md"
          if [ ! -f "$NOTES" ]; then echo "Missing $NOTES; refusing to create a release without reviewed notes."; exit 1; fi
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "$SKILL v$VERSION" \
            --notes-file "$NOTES" \
            dist/*.zip dist/SHA256SUMS.txt
          echo "Draft created. Verify the downloaded assets before publishing."
